<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <title>Migrar imagens das notícias — LIGATS</title>
  <style>
    :root { color-scheme: light; font-family: Arial, sans-serif; }
    body { margin: 0; background: #eef5f3; color: #123b34; }
    main { width: min(760px, calc(100% - 32px)); margin: 48px auto; padding: 32px; background: #fff; border: 1px solid #cbded8; border-radius: 16px; box-sizing: border-box; }
    button { padding: 0.85rem 1.1rem; border: 0; border-radius: 0.55rem; color: #fff; background: #0d5d4d; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: 0.6; cursor: wait; }
    #status { margin-top: 1rem; padding: 1rem; background: #f3f8f6; border-radius: 0.5rem; overflow-wrap: anywhere; }
    .erro { color: #9b271e; }
    .sucesso { color: #17613e; }
  </style>
</head>
<body>
  <main>
    <h1>Migrar imagens para o Cloud Storage</h1>
    <p>Esta ferramenta administrativa envia as 20 imagens das oito notícias para o bucket <strong>site-images</strong> e atualiza somente seus caminhos no Supabase.</p>
    <p>Os arquivos estáticos permanecerão disponíveis até a migração ser verificada.</p>
    <button id="migrar" type="button" hidden>Migrar 20 imagens</button>
    <div id="status" role="status" aria-live="polite">Verificando a sessão administrativa…</div>
    <ol id="resultados"></ol>
  </main>
  <script type="module" src="/assets/js/migrar-imagens-noticias-storage.js?v=1"></script>
</body>
</html>
